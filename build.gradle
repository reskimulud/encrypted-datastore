// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9 ships KGP 2.2.10, which does not support Gradle 9.6.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.4.21"
    }
}

plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = 'io.github.reskimulud'
version = '0.2.0'

ext["cipherKey"] = '0123456789abcdef0123456789abcdef'
ext["iv"] = 'abcdefghijklmnop'


apply from: "${rootDir}/scripts/publish-root.gradle"
